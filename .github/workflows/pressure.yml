name: Pressure check

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pressure-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pressure and notify
        run: python3 check_pressure.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Save state
        run: |
          git config user.name "pressure-bot"
          git config user.email "pressure-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable pressure.yml --repo "${{ github.repository }}" || true
